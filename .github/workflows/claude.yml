name: Claude Code

# Shared Claude workflow for hourcar-mn repos. Mention @claude in an issue or
# PR comment and Claude answers or does the request. "@claude review" on a PR
# gets a review with findings posted as inline comments on the changed lines.
# Only repo owners, members, and collaborators can trigger it.
#
# Each repo calls it from .github/workflows/claude.yml:
#
#   name: Claude Code
#   on:
#     issue_comment:
#       types: [created]
#     pull_request_review_comment:
#       types: [created]
#   jobs:
#     claude:
#       if: contains(github.event.comment.body, '@claude')
#       uses: hourcar-mn/.github/.github/workflows/claude.yml@main
#       secrets: inherit
#       permissions:
#         contents: read
#         pull-requests: write
#         issues: read
#         id-token: write
#         actions: read
on:
  workflow_call:
    inputs:
      allowed_tools:
        description: Extra tools Claude may use, e.g. 'Bash(npm:*),Bash(gh api:*)'
        type: string
        default: ''
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true

jobs:
  claude:
    if: |
      contains(github.event.comment.body, '@claude') &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
          # The action starts the inline-comment tool only when --allowedTools
          # names it.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment${{ inputs.allowed_tools && format(',{0}', inputs.allowed_tools) || '' }}"
            --append-system-prompt "When asked to review a pull request, look for real bugs, security problems, and broken edge cases in the changed code, not style. Post each finding as an inline comment on the line it is about, then keep your summary comment short."
