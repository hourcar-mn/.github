name: Claude Code

# Shared Claude workflow for hourcar-mn repos.
# - "@claude review" as a top-level PR comment: code review with inline comments
# - any other @claude mention: Claude answers or does the request
# Only repo owners, members, and collaborators can trigger it.
#
# Each repo calls it from .github/workflows/claude.yml:
#
#   name: Claude Code
#   on:
#     issue_comment:
#       types: [created]
#     pull_request_review_comment:
#       types: [created]
#   jobs:
#     claude:
#       if: contains(github.event.comment.body, '@claude')
#       uses: hourcar-mn/.github/.github/workflows/claude.yml@main
#       secrets: inherit
#       permissions:
#         contents: read
#         pull-requests: write
#         issues: read
#         id-token: write
#         actions: read
on:
  workflow_call:
    inputs:
      allowed_tools:
        description: Extra tools Claude may use for @claude requests, e.g. 'Bash(npm:*),Bash(gh api:*)'
        type: string
        default: ''
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true

jobs:
  review:
    if: |
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '@claude review') &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          # --comment posts findings on the PR instead of only the Actions log,
          # and the action starts the inline-comment tool only when
          # --allowedTools names it. The plugin's skip checks are meant for
          # automatic triggers, so the appended prompt lifts the two that would
          # block an explicit request.
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.issue.number }}'
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment"
            --append-system-prompt "A repo member explicitly asked for this review with an @claude review comment. Review the PR even if it is a draft or Claude has already commented on it. Still skip it if it is closed. Do not repeat issues Claude already raised in earlier comments on this PR."

  claude:
    if: |
      contains(github.event.comment.body, '@claude') &&
      !(github.event.issue.pull_request && startsWith(github.event.comment.body, '@claude review')) &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
          claude_args: ${{ inputs.allowed_tools && format('--allowedTools "{0}"', inputs.allowed_tools) || '' }}
